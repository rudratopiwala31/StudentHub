<!DOCTYPE html>
<html>
<head>
    <title>Student Hub - Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:white;
        }

        .login{
            width:300px;
            border:1px solid #ccc;
            padding:20px;
            text-align:center;
            border-radius:10px;
        }

        h2{
            color:#1461b3;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:95%;
            padding:10px;
            background:#1461b3;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        a{
            text-decoration:none;
            color:#1461b3;
        }
    </style>
</head>

<body>

<div class="login">

    <h2>Student Hub</h2>

    <form action="main.html">

        <input type="text" placeholder="Username" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <br>

    <p>Don't have an account?</p>

    <a href="register.html">Register Here</a>

</div>

</body>
</html>
