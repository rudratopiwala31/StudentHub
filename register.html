<!DOCTYPE html>
<html>

<head>

    <title>StudentHub - Register</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body class="register-page">

    <div class="box">

        <h1>🎓 StudentHub</h1>

        <p>Create Your Student Account</p>

        <form id="registerForm">

            <!-- Name -->

            <label for="name">Full Name</label>

            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name">

            <span id="nameError" class="error"></span>


            <!-- Email -->

            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email">

            <span id="emailError" class="error"></span>


            <!-- Mobile Number -->

            <label for="mobile">Mobile Number</label>

            <input type="text"
                   id="mobile"
                   name="mobile"
                   placeholder="Enter 10 digit mobile number">

            <span id="mobileError" class="error"></span>


            <!-- Password -->

            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password">

            <span id="passwordError" class="error"></span>

            <p id="strength"></p>


            <!-- Confirm Password -->

            <label for="confirmPassword">Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm password">

            <span id="confirmPasswordError" class="error"></span>


            <!-- Course -->

            <label for="course">Course</label>

            <select id="course" name="course">

                <option value="">Select Course</option>

                <option value="BTech Computer Engineering">
                    BTech Computer Engineering
                </option>

                <option value="BTech IT">
                    BTech IT
                </option>

                <option value="BCA">
                    BCA
                </option>

                <option value="MCA">
                    MCA
                </option>

            </select>

            <span id="courseError" class="error"></span>


            <!-- Year -->

            <label for="year">Year</label>

            <select id="year" name="year">

                <option value="">Select Year</option>

                <option value="1st Year">1st Year</option>

                <option value="2nd Year">2nd Year</option>

                <option value="3rd Year">3rd Year</option>

                <option value="4th Year">4th Year</option>

            </select>

            <span id="yearError" class="error"></span>


            <!-- Gender -->

            <label>Gender</label>

            <div class="gender">

                <input type="radio"
                       id="male"
                       name="gender"
                       value="Male">

                <label for="male">Male</label>


                <input type="radio"
                       id="female"
                       name="gender"
                       value="Female">

                <label for="female">Female</label>


                <input type="radio"
                       id="other"
                       name="gender"
                       value="Other">

                <label for="other">Other</label>

            </div>

            <span id="genderError" class="error"></span>


            <!-- Terms -->

            <div class="terms">

                <input type="checkbox"
                       id="terms"
                       name="terms">

                <label for="terms">
                    I accept the Terms and Conditions
                </label>

            </div>

            <span id="termsError" class="error"></span>


            <br>

            <input type="submit" value="Register">

        </form>


        <p id="successMessage" class="success"></p>


        <p>
            Already have an account?

            <a href="login.html">
                Login Here
            </a>
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
